[package]
name = "herdinator"
version = "0.1.1"
edition = "2021"
description = "A tmuxinator-compatible project manager for named Herdr workspaces"
license = "Apache-2.0"
repository = "https://github.com/mhernandezve/herdinator"
keywords = ["herdr", "tmuxinator", "workspace", "terminal", "cli"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3.1"
shell-words = "1.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
