[package]
name = "herdinator"
version = "0.1.0"
edition = "2021"
description = "A tmuxinator-style project manager for Herdr"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shellexpand = "3.1"
shell-words = "1.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
